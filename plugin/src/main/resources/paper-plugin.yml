name: Mamble
version: '${version}'
main: io.github.mamble.MamblePlugin
api-version: '1.21'
description: スロット台と交換機を追加する Paper プラグイン
permissions:
  mamble.use:
    description: 残高の確認と bet の変更 (/mamble, /mamble bet)
    default: true
  mamble.admin:
    description: 台の設置・撤去、報酬表と残高の編集、設定の確認とリロード
    default: op
